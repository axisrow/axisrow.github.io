<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="tcf-title tcf-desc">
  <title id="tcf-title">tg_content_factory pipeline diagram</title>
  <desc id="tcf-desc">Architecture diagram (not a screenshot): Telegram accounts feed a multi-account collector with flood-wait rotation; messages land in a SQLite FTS5 store surfaced through three search modes (local, Telegram API, LLM agent), keyword alerts with bot notifications, and a FastAPI web dashboard.</desc>
  <rect width="960" height="360" rx="14" fill="#f6f7f9"/>
  <g font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace">
    <text x="32" y="42" font-size="15" font-weight="700" letter-spacing="2" fill="#3c4350">TG_CONTENT_FACTORY — PIPELINE</text>
    <text x="32" y="62" font-size="11" fill="#8a8f98">architecture diagram · not a screenshot</text>

    <!-- sources -->
    <rect x="32" y="120" width="150" height="120" rx="10" fill="#ffffff" stroke="#c9cdd4"/>
    <text x="50" y="150" font-size="13" font-weight="700" fill="#3c4350">Telegram</text>
    <text x="50" y="172" font-size="11" fill="#5c6370">channels</text>
    <text x="50" y="190" font-size="11" fill="#5c6370">supergroups</text>
    <text x="50" y="208" font-size="11" fill="#5c6370">forums</text>
    <text x="50" y="226" font-size="11" fill="#5c6370">multi-account</text>

    <!-- collector -->
    <rect x="240" y="120" width="170" height="120" rx="10" fill="#ffffff" stroke="#c9cdd4"/>
    <text x="258" y="150" font-size="13" font-weight="700" fill="#3c4350">Collector</text>
    <text x="258" y="172" font-size="11" fill="#5c6370">scheduled fetch</text>
    <text x="258" y="190" font-size="11" fill="#5c6370">flood-wait rotation</text>
    <text x="258" y="208" font-size="11" fill="#5c6370">anti-spam filters</text>
    <text x="258" y="226" font-size="11" fill="#5c6370">deduplication</text>

    <!-- storage -->
    <rect x="468" y="120" width="160" height="120" rx="10" fill="#ffffff" stroke="#c9cdd4"/>
    <text x="486" y="150" font-size="13" font-weight="700" fill="#3c4350">SQLite</text>
    <text x="486" y="172" font-size="11" fill="#5c6370">FTS5 full-text</text>
    <text x="486" y="190" font-size="11" fill="#5c6370">search cache</text>
    <text x="486" y="208" font-size="11" fill="#5c6370">encrypted sessions</text>
    <text x="486" y="226" font-size="11" fill="#5c6370">task queue</text>

    <!-- consumers -->
    <rect x="686" y="86" width="242" height="56" rx="10" fill="#ffffff" stroke="#c9cdd4"/>
    <text x="704" y="110" font-size="13" font-weight="700" fill="#3c4350">Search ×3</text>
    <text x="704" y="128" font-size="11" fill="#5c6370">local FTS5 · Telegram API · LLM agent</text>
    <rect x="686" y="158" width="242" height="56" rx="10" fill="#ffffff" stroke="#c9cdd4"/>
    <text x="704" y="182" font-size="13" font-weight="700" fill="#3c4350">Keyword alerts</text>
    <text x="704" y="200" font-size="11" fill="#5c6370">text + regex → Telegram bot notify</text>
    <rect x="686" y="230" width="242" height="56" rx="10" fill="#ffffff" stroke="#c9cdd4"/>
    <text x="704" y="254" font-size="13" font-weight="700" fill="#3c4350">FastAPI dashboard</text>
    <text x="704" y="272" font-size="11" fill="#5c6370">web panel · session encryption · Docker</text>

    <!-- arrows -->
    <g stroke="#9aa0aa" stroke-width="2" fill="none" marker-end="url(#a)">
      <line x1="182" y1="180" x2="234" y2="180"/>
      <line x1="410" y1="180" x2="462" y2="180"/>
      <line x1="628" y1="180" x2="680" y2="114"/>
      <line x1="628" y1="180" x2="680" y2="186"/>
      <line x1="628" y1="180" x2="680" y2="258"/>
    </g>
    <defs>
      <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
        <path d="M0,0 L8,4 L0,8 z" fill="#9aa0aa"/>
      </marker>
    </defs>

    <text x="32" y="322" font-size="11" fill="#5c6370">Verifiable scenario: pip install tg-agent → python -m src.main serve → dashboard on http://localhost:8080</text>
  </g>
</svg>
